apiVersion: v1
kind: Service
metadata:
  name: productpage-service
  labels:
    app: productpage
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: productpage
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
