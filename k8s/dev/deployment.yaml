apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage
  namespace: bookinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: productpage
  template:
    metadata:
      labels:
        app: productpage
    spec:
      containers:
        - name: productpage
          image: 123456789.dkr.ecr.ap-southeast-1.amazonaws.com/productpage:v1
          ports:
            - containerPort: 8080