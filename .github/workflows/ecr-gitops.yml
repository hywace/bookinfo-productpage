name: Build Push ECR and Update GitOps

on:
  push:
    branches: [main, dev, uat]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || secrets.ECR_REGISTRY }}
  IMAGE_NAME: productpage
  VALUES_FILE: helm/values-dev.yaml

jobs:
  build-push-update:
    name: Build image push to ECR update Helm values
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Debug ECR login
        run: |
          echo "=== Docker config auths ==="
          cat ~/.docker/config.json | grep -o '"auths":{[^}]*}' || echo "no auths found"
          echo "=== ECR registry check ==="
          aws ecr describe-repositories --region "$AWS_REGION" \
            --repository-names "$IMAGE_NAME" \
            --query 'repositories[0].repositoryUri' --output text 2>&1 || echo "repo not found"

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$IMAGE_NAME:$BRANCH_TAG" \
            .
          docker push "$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$IMAGE_NAME:$BRANCH_TAG"

      - name: Install yq
        uses: mikefarah/yq@v4.44.2

      - name: Update Helm values
        run: |
          yq -i '.image.repository = strenv(ECR_REGISTRY) + "/" + strenv(IMAGE_NAME)' "$VALUES_FILE"
          yq -i '.image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"

      - name: Commit updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git diff --staged --quiet && exit 0
          git commit -m "chore(gitops): update image tag to $IMAGE_TAG [skip ci]"
          git push
