name: Build Push ECR and Update GitOps

on:
  push:
    branches: [main, dev, uat]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || secrets.ECR_REGISTRY }}
  IMAGE_NAME: productpage
  VALUES_FILE: helm/values-dev.yaml

jobs:
  build-push-update:
    name: Build image push to ECR update Helm values
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        run: |
          test -n "${{ env.AWS_REGION }}" || (echo "Missing AWS_REGION (set vars or secrets)" && exit 1)
          test -n "${{ env.ECR_REGISTRY }}" || (echo "Missing ECR_REGISTRY (set vars or secrets)" && exit 1)
          test -n "${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}" || (echo "Missing AWS_ROLE_ARN (set vars or secrets)" && exit 1)

      - name: Debug runtime context
        run: |
          echo "repo=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "event=${{ github.event_name }}"
          echo "region_set=$([[ -n '${{ env.AWS_REGION }}' ]] && echo true || echo false)"
          echo "registry_set=$([[ -n '${{ env.ECR_REGISTRY }}' ]] && echo true || echo false)"
          echo "role_arn=${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}"

      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            core.info(`oidc_aud=${payload.aud}`);
            core.info(`oidc_sub=${payload.sub}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=${BRANCH}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}

      - name: Install yq
        uses: mikefarah/yq@v4.44.2

      - name: Update Helm values
        run: |
          yq -i '.image.repository = strenv(ECR_REGISTRY) + "/" + strenv(IMAGE_NAME)' "$VALUES_FILE"
          yq -i '.image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"

      - name: Commit updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git diff --staged --quiet && exit 0
          git commit -m "chore(gitops): update image tag to $IMAGE_TAG [skip ci]"
          git push
