name: Github Actions Demo
on:
  pull_request:
    types:
      - closed
    branches:
      - main
      - dev
      - uat
      - prod

jobs:
  check_branch:
      runs-on: ubuntu-latest
      if: github.ref_name == 'main' || github.ref_name == 'dev' || github.ref_name == 'uat' || github.ref_name == 'prod'
      steps:
        - name: Check Branch
          run: echo "Branch is valid"

  check_merged:
    runs-on: ubuntu-latest
    needs: check_branch
    if: github.event.pull_request.merged == true
    steps:
        - name: Check Merge
          run: echo "Pull request is merged"
  
  #compile:
    #needs: check_merged
    #runs-on: ubuntu-latest
    #steps:
      #- uses: actions/checkout@v4
      #- name: Use NodeJS 24
        #uses: actions/setup-node@v4
        #with:
          #node-version: '24.x'
      #- name: Compile
        #run: |
          #ls -la
          #npm install
          #npm run build"""

  # https://github.com/appleboy/jenkins-action
  # TODO Setup env variables from secrets and pass them to docker build
  trigger_jenkins:
    environment: ${{ github.ref_name }}
    needs: check_merged
    runs-on: ubuntu-latest
    steps:
      - name: Convert branch name to uppercase
        run: |
           echo "REF_UPPER=${{ github.ref_name }}" | tr '[:lower:]' '[:upper:]' >> $GITHUB_ENV 
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Create env file
        run: |
          echo "${{ secrets[format('ENV_{0}', env.REF_UPPER)] }}" > .env.${{ github.ref_name }}
      - name: Set up Fortinet to access company network
        uses: horellana/openconnect@v1.0.1
        with:
          host: ${{ secrets.FORTINET_HOST }}
          user: ${{ secrets.FORTINET_USER }}
          password: ${{ secrets.FORTINET_PASSWORD }}
      # - name: Set up WireGuard to access company network
        # uses: egor-tensin/setup-wireguard@v1.2.0
        # with:
          # endpoint: ${{ secrets.VPN_ENDPOINT }}
          # endpoint_public_key: ${{ secrets.VPN_PUBLIC_KEY }}
          # ips: ${{ secrets.VPN_IPS }}
          # allowed_ips: ${{ secrets.VPN_ALLOWED_IPS }}
          # private_key: ${{ secrets.VPN_PRIVATE_KEY }}
          # preshared_key: ${{ secrets.VPN_PRESHARED_KEY }}
      - name: Build Docker Image
        uses: azure/docker-login@v2
        with:
            login-server: ${{}}
            username: ${{}}
            password: ${{}}
      - run: |
          GIT_COMMIT_ID=$(git rev-parse --short=7 HEAD)
          dockerImage=""
          docker build --build-args BRANCH_NAME=${{ github.ref_name }} -t $dockerImage .
          docker push $dockerImage
      - name: Trigger Jenkins Job
        if: success()
        uses: appleboy/jenkins-action@v1
        with:
          url: 'https://jenkins.aspial.com'
          token: ${{ secrets.JENKINS_TOKEN }}
          job: ${{ secrets.JENKINS_JOB_NAME }}
          parameters: |
            img_name=${{ env.IMG_NAME }}
      - name: Notify on success
        if: success()
        run: echo "Jenkins job completed successfully."
      - name: Notify on failure
        if: failure()
        run: echo "Jenkins job failed."
          
